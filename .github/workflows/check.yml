name: Check wallpaper collection

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wallpapers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the 20 original PNG wallpapers
        run: python3 scripts/check-wallpapers.py
